
task allUnitTest {
}

// TODO: Re-add license plugin once AGP 9 support is available
// See: https://github.com/jaredsburrows/gradle-license-plugin/issues/693
// task allLicenseReport {}

buildscript {
    ext {
        defineClasspath = { dependencyHandler ->
            dependencyHandler.classpath "org.owasp:dependency-check-gradle:11.1.1"
            // TODO: Re-add once AGP 9 compatible version is released
            // See: https://github.com/jaredsburrows/gradle-license-plugin/issues/693
            // dependencyHandler.classpath 'com.jaredsburrows:gradle-license-plugin:0.9.8'
        }

        forAllProjects = { project ->
            if (project == project.getRootProject()) {
                // avoid adding plugins to root project
                return
            }

            // TODO: Re-add once AGP 9 compatible version is released
            // See: https://github.com/jaredsburrows/gradle-license-plugin/issues/693
            // project.apply plugin: 'com.jaredsburrows.license'
            // project.licenseReport {
            //     generateHtmlReport = false
            //     generateJsonReport = true
            //     copyHtmlReportToAssets = false
            //     copyJsonReportToAssets = false
            // }

            if (project.name != "smfsetup") {
                project.apply from: "$projectDir/android-commons/gradle-commons/ktlint.gradle"
                project.apply from: "$projectDir/android-commons/gradle-commons/detekt.gradle"
            }

            project.afterEvaluate {
                // TODO: Re-add once license plugin is restored
                // allLicenseReport.dependsOn {
                //     project.tasks.findAll {
                //         task -> task.name.matches('license.*Report') &&
                //                 task.name.contains("Release") &&
                //                 !task.name.contains("test")
                //     }
                // }
                // One unit test task per module: the one named by the project property
                // `smfUnitTestTask`, otherwise the first *DebugUnitTest, otherwise the first
                // test*UnitTest. Tasks are picked by name only: realizing every task (as
                // tasks.findAll did) makes AGP 9.5 create the Compose preview runfiles task of
                // variants without unit tests, which fails the configuration.
                allUnitTest.dependsOn {
                    def candidates = project.tasks.names.findAll { it.matches('test.*UnitTest') }
                    def configured = project.findProperty('smfUnitTestTask')
                    if (configured) {
                        if (!candidates.contains(configured)) {
                            throw new GradleException("smfUnitTestTask '$configured' is not a unit test task of ${project.path}")
                        }
                        return [project.tasks.named(configured)]
                    }
                    def chosen = candidates.find { it.endsWith('DebugUnitTest') } ?: candidates.find()
                    chosen ? [project.tasks.named(chosen)] : []
                }
            }
        }
    }
}
