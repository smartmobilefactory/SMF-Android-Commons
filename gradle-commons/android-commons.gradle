apply plugin: 'org.owasp.dependencycheck'

android {
    lint {
        abortOnError = false

        lintConfig = file("$projectDir/../android-commons/gradle-commons/android-lint-config.xml")
        xmlOutput = file("$projectDir/build/reports/lint/lint-result.xml")
        htmlOutput = file("$projectDir/build/reports/lint/lint-result.html")
    }
}

dependencyCheck {
    format = 'ALL'
}
